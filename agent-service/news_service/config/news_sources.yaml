  # 以下为本轮车企官网静态采集适配测试来源。
  - name: "广汽集团"
    enabled: true
    domain: "gacgroup.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    column_urls:
      - "https://www.gacgroup.com/cn/news"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    published_time_order: "desc"
    # 官网数字分页通过公开 CMS JSON POST 接口加载，pageNo 为页面序号。
    # 统一由 Structured Discovery 推进，详情页仍使用既有正式解析链路。
    structured_discovery:
      mode: "json_endpoint"
      prefer: true
      data_url: "https://www.gacgroup.com/boss-cms-app/frontend/article/queryByPageForPublish"
      request_method: "POST"
      request_headers:
        Referer: "https://www.gacgroup.com/cn/news"
        Accept: "application/json, text/plain, */*"
      request_body:
        categoryCode: "COL-XWZX-QYDT"
        beginTime: ""
        searchKeyword: ""
        pageSize: 8
        language: "1"
      records_path: "data.list"
      article_url_template: "/cn/news/detail?baseid={baseId}"
      article_title_field: "title"
      article_time_field: "publishTime"
      url_base: "https://www.gacgroup.com"
      pagination:
        page_param: "pageNo"
        start_page: 1
    selectors:
      article_link_selector: "a[href*='/cn/news/detail']"
      title_selector: ".top_box .tit"
      # .content 是“更多动态”卡片摘要；真实文章正文位于详情页 .article。
      content_selector: ".article"
      publish_time_selector: ".top_box .date p"
      next_page_selector: null
      require_title_selector: true
      require_content_selector: true

  - name: "吉利汽车"
    enabled: true
    domain: "geely.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    crawler_type: "dynamic"
    detail_crawler_type: "dynamic"
    wait_time: 5
    column_urls:
      - "https://www.geely.com/news"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    published_time_order: desc
    selectors:
      article_link_selector: "a[href*='/news/']"
      title_selector: ".news-detail .title"
      # detail-text 仅含标题、日期和导语；.info 才是新闻主体。其仅含图片
      # 时复用通用媒体判定，写入“图片类新闻”标记而非错误保存导语。
      content_selector: ".news-detail .info"
      publish_time_selector: ".news-detail .date"
      # 官网“加载更多”会在当前 DOM 追加下一批真实新闻卡片。
      next_page_selector: "div.showMore.geely--global--button"

  - name: "长城汽车"

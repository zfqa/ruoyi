# 真实站点功能联调配置。每个启用来源单次最多采集 50 篇、至多遍历配置的栏目页数。
sources:
  - name: "中国长安汽车集团"
    enabled: true
    domain: "ccag.cn"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    column_urls:
      - "https://www.ccag.cn/news/group"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    published_time_order: "desc"
    structured_discovery:
      # 官网页面预加载的公开内容接口，返回稳定的 records/pageNum 分页。
      mode: "json_endpoint"
      prefer: true
      data_url: "https://prod-api.ccag.cn/cms/app/content/page"
      query_params:
        pageSize: 5
        categoryCode: "jituan_code"
      records_path: "data.records"
      article_url_template: "/news/detail/{contentId}"
      article_title_field: "contentTitle"
      article_time_field: "publicDate"
      url_base: "https://www.ccag.cn"
      pagination:
        page_param: "pageNum"
        start_page: 1
    selectors:
      article_link_selector: "a.news-item"
      title_selector: "h1.text-gray-900"
      content_selector: null
      publish_time_selector: "span.flex.items-center.gap-1.whitespace-nowrap + span.flex.items-center.gap-1.whitespace-nowrap"
      next_page_selector: null

  - name: "长安汽车全球官网"

    structured_discovery:
      mode: "json_endpoint"
      prefer: true
      data_url: "https://www.lamborghini.com/en-en/api"
      query_params:
        views: "rest_news_view"
        langcode: "en"
        tags[]: 137
      records_path: "data[0].items"
      article_url_field: "urls[0].url"
      article_title_field: "elements[0].labelsLong[0].value[0]"
      article_time_field: "dateTime.value.dateFormatted"
      article_time_format: "%d %B %Y"

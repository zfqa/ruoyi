    day_of_week: "mon"
    crawl_time: "02:00"
    # 官方新闻栏目由公开 JSON POST 接口分页提供；详情页继续使用现有静态解析器。
    crawler_type: "static"
    detail_crawler_type: "static"
    wait_time: 3
    column_urls:
      - "https://www.haval.com.cn/news.html"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    published_time_order: "desc"
    structured_discovery:
      mode: "json_endpoint"
      prefer: true
      data_url: "https://www.haval.com.cn/search/news-search"
      request_method: "POST"
      request_encoding: "json"
      request_crawler_type: "static"
      request_body:
        site_id: 183
        size: 6
        category_id:
          - 1000078
          - 1000074
        content: ""
      records_path: "data.list"
      article_url_field: "release_url"
      article_title_field: "title"
      article_time_field: "publish_time"
      article_time_format: "%Y-%m-%d"
      url_base: "https://www.haval.com.cn"
      pagination:
        page_param: "page"
        start_page: 1
        page_step: 1
    selectors:
      article_link_selector: "a[href*='/news/'][href$='.html']"
      title_selector: "h1.news-detail-title"
      content_selector: ".news-cont-left"
      publish_time_selector: ".news-by.source-str"
      publish_time_regex: "(\\d{4}-\\d{2}-\\d{2})"
      next_page_selector: null
      infinite_scroll: false
      require_title_selector: true
      content_exclude_selectors:
        - ".news-item-by"
        - ".qrcode-tools"
        - "#newsLableBoxPc"
        - ".news_digest span"
        - "#briefText"
        - ".news_details_tool"
        - ".poster_mask"

  - name: "蔚来汽车"
    enabled: false
    domain: "nio.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    # News 列表由官方服务端渲染，Show More 提供真实 ?page= 链接；静态
    # 发现可稳定沿该公开链接翻页，无需依赖浏览器点击。
    crawler_type: "static"
    wait_time: 1
    column_urls:
      # www.nio.com/news currently returns an HTTP 567 block page to the
      # headless browser.  This is NIO's official, publicly accessible
      # newsroom on the same nio.com whitelist domain.
      - "https://us.nio.com/news"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 5
    published_time_order: desc
    selectors:
      # Exclude the newsroom contact page; all remaining matching links are
      # article detail pages such as /news/20251001001.
      article_link_selector: "a[href^='/news/']:not([href='/news/contact'])"
      article_time_selector: ".news_newsItem__aH7_h p, .news_heroItem__l99Zi p"
      title_selector: "h1"
      content_selector: "div[class^='detail_content']"
      publish_time_selector: "div[class^='detail_titles'] > p"
      # 官方 Show More 是普通详情列表页链接（/news?page=1），点击后进入
      # 下一批新闻；由共享 DynamicPagination 流程处理。
      next_page_selector: ".news_action__Qoq4z a[href*='page=']"

  - name: "理想汽车"
    enabled: true
    domain: "lixiang.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    crawler_type: "dynamic"
    detail_crawler_type: "static"
    wait_time: 1
    column_urls:
      - "https://www.lixiang.com/news.html"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    selectors:
      article_link_selector: "a[href^='/news/'][href$='.html']"
      title_selector: ".title.m-h1"
      content_selector: null
      publish_time_selector: ".date.m-exp1"
      next_page_selector: null
      infinite_scroll: true

  - name: "哪吒汽车"
    enabled: false
    domain: "hozonauto.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    crawler_type: "dynamic"
    wait_time: 5
    column_urls:
      - "https://hozonauto.com/news.html"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 5
    published_time_order: "desc"
    selectors:
      # The listing uses relative routes such as newsDetail.html?id=903;
      # it does not use a /news/ path.
      article_link_selector: "a[href^='newsDetail.html?id=']"
      title_selector: "#newdata .detail-title"
      content_selector: "#newdata .content"
      publish_time_selector: "#newdata .tag"
      # LayUI 分页会在点击后以公开 AJAX 请求替换新闻卡片；没有可用
      # 的静态 href，因此使用现有通用 Dynamic click pagination。
      next_page_selector: ".layui-laypage-next"

  - name: "大众汽车中国"
    enabled: true
    domain: "vw.com.cn"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    crawler_type: "static"
    detail_crawler_type: "static"
    wait_time: 1
    column_urls:
      - "https://www.vw.com.cn/Home/PressReleaseList"
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    published_time_order: "desc"
    structured_discovery:
      mode: "json_endpoint"
      prefer: true
      data_url: "https://www.vw.com.cn/Home/getNewsPage"
      query_params:
        type: 0
      request_method: "GET"
      request_crawler_type: "dynamic"
      records_path: "data.list"
      article_url_template: "/Home/PressReleaseDetail?id={custom_id}"
      article_title_field: "title"
      article_time_field: "release_date"
      article_time_format: "%Y-%m-%d"
      url_base: "https://www.vw.com.cn"
      pagination:
        page_param: "page"
        start_page: 1
        page_step: 1
    selectors:
      article_link_selector: ".list-box.active a[href*='PressReleaseDetail']"
      title_selector: "h1"
      content_selector: null
      publish_time_selector: "span.date"
      # 官网“加载更多”不更改 URL，但会追加下一批新闻详情链接。
      next_page_selector: ".load-more"

  # 甲方补充的海外及国内官网。以下条目只使用官方新闻/媒体中心，
  # 采集时由 publish_time_start / publish_time_end 控制新闻发布时间窗口。
  - name: "丰田汽车"
    enabled: true
    domain: "global.toyota"
    # Global Toyota 的官方 Latest News 汇总页还会列出其官方赛车新闻室。
    # 仅允许这里明确列出的第一方域名；不会放开到任意外站。
    allowed_domains:
      - "global.toyota"
      - "toyotagazooracing.com"
      - "toyota-racing-newsroom.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    # 一个业务来源聚合其明确公开的三个官方新闻栏目；详情解析、时间过滤
    # 与去重仍统一在“丰田汽车”这一来源下执行。
    crawler_type: "static"
    detail_crawler_type: "static"
    wait_time: 1
    column_urls: ["https://global.toyota/en/newsroom/toyota/"]
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    max_pages: 50
    published_time_order: desc
    # 三个 Feed 都提供官方列表/API发布时间；优先它而非详情正文中的
    # 引用、赛事日期或历史资料日期。
    prefer_listing_published_at: true
    selectors:
      title_selector: "h1.title, h2"
      title_exclude_selectors:
        - "span.subtitle"
      content_selector: null
      publish_time_selector: null
    discovery_feeds:
      # Toyota Global 的根 News Release 流，只保留 global.toyota 自身
      # 记录并排除根列表中明确标记为 Lexus 的独立品牌新闻。
      - name: "Toyota Global News Release"
        column_urls: ["https://global.toyota/en/newsroom/"]
        allowed_domains: ["global.toyota"]
        crawler_type: "static"
        max_pages: 10
        published_time_order: desc
        structured_discovery:
          mode: "json_endpoint"
          prefer: true
          data_url: "https://global.toyota/en/_system/api/search/article"
          request_method: "POST"
          request_encoding: "form"
          request_body:
            limit: 20
            tags[]: 3
            tagOperation: "or"
            labelTags[]: [553, 5272, 4592]
            labelTagOperation: "or"
            gridMoreSize: 10
          records_path: "list"
          article_url_field: "url"
          article_title_field: "title"
          article_time_field: "date"
          record_exclude_filters:
            category: "lexus"
          pagination:
            offset_param: "offset"
            start_offset: 0
            page_size: 20
      # Toyota GAZOO Racing 的公开新闻 JSON；RSS 本身提供完整历史记录，
      # 时间范围由共享过滤逻辑处理。
      - name: "Toyota GAZOO Racing Press Release"
        column_urls: ["https://toyotagazooracing.com/pressrelease/"]
        allowed_domains: ["toyotagazooracing.com"]
        crawler_type: "static"
        published_time_order: desc
        structured_discovery:
          mode: "json_endpoint"
          prefer: true
          data_url: "https://toyotagazooracing.com/json/pressrelease/"
          records_path: "rss.channel.item"
          article_url_field: "link"
          article_title_field: "title"
          article_time_field: "pubDate"
          url_base: "https://toyotagazooracing.com"
          article_url_exclude_patterns:
            - "^/gr/[^/]+/?$"
      # Toyota Racing Newsroom 的公开 WEC Press Releases 接口。接口返回
      # 服务器渲染的卡片片段，仍使用通用 selector 发现链接和列表日期。
      - name: "Toyota Racing Newsroom WEC Press Releases"
        column_urls: ["https://toyota-racing-newsroom.com/blog/wec/press-releases"]
        allowed_domains: ["toyota-racing-newsroom.com"]
        crawler_type: "static"
        max_pages: 10
        published_time_order: desc
        selectors:
          article_link_selector: "a.item-list-item-link[href]"
          article_time_selector: ".item-list-item-date"
        structured_discovery:
          mode: "json_html_fragment"
          prefer: true
          data_url: "https://toyota-racing-newsroom.com/api/article"
          query_params:
            grid: 2
            size: 12
            type: "channel"
            id: 32
            q: ""
          html_path: "items"
          article_url_strip_suffixes: ["/text"]
          pagination:
            offset_param: "offset"
            start_offset: 0
            page_size: 12

  - name: "宾利汽车"
    enabled: true
    domain: "bentleymedia.com"
    schedule_type: "cron"
    day_of_week: "mon"
    crawl_time: "02:00"
    # 官方公开搜索接口按日期返回完整新闻列表；详情页继续复用通用静态解析。
    crawler_type: "static"
    detail_crawler_type: "static"
    wait_time: 2
    column_urls: ["https://www.bentleymedia.com/en/news"]
    keywords: []
    keyword_mode: "off"
    crawl_frequency: "24h"
    max_articles_per_run: 50
    # 官方响应当前声明 totalPages=25；此处保留有限硬上限，避免异常列表无限请求。
    max_pages: 50
    published_time_order: "desc"
    structured_discovery:
      mode: "json_endpoint"
      prefer: true
      data_url: "https://www.bentleymedia.com/dealernetapi/v1/search"
      request_method: "POST"
      request_encoding: "json"
      request_crawler_type: "static"
      request_body:
        query: ""
        searchType: "bulletins"
        orderBy: "date"
        paging:
          resultsPerpage: 24
      records_path: "results"
      article_url_field: "url"
      article_title_field: "title"
      article_time_field: "published"
      url_base: "https://www.bentleymedia.com"
      pagination:
        page_param: "paging.page"
        start_page: 1
    selectors:
      article_link_selector: "a[href^='/en/newsitem/']"
      # Official media entries have no rendered h1; their document title is
      # consistently present in both the static and rendered representations.
      title_selector: "title"
      title_strip_prefix: "BENTLEY NEWSROOM : "
      # Standard releases use .Content.s-cms.  Official media-only assets
      # instead expose their primary image directly within the site body.
      content_selector: ".Content.s-cms, main.Site-body"
      publish_time_selector: ".Tags.Tags--article"
      publish_time_regex: "(\\d{2}/\\d{2}/\\d{2})"
      next_page_selector: null
      infinite_scroll: false
      # The strict media-item route prevents ordinary navigation pages from
      # becoming candidates, while allowing a safe document-title fallback.
      require_title_selector: false
      # A small media-asset subset intentionally has no textual content
      # container but remains a verified official news detail page.
      require_content_selector: false
      content_exclude_selectors:
        - ".MediaCard"
        - ".Menu"
        - ".Alert"


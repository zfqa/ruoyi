# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 50MB
      # 设置总上传的文件大小
      max-request-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 业务解析任务配置
business:
  llm:
    # 用于加密持久化前端保存的API Key；生产环境请通过LLM_CONFIG_SECRET设置独立且稳定的随机密钥
    persistence-secret: ${LLM_CONFIG_SECRET:${token.secret}}
  text:
    llm:
      # 推理型模型可能超过90秒，文本抽取独立设置较长超时
      timeout-seconds: ${TEXT_LLM_TIMEOUT_SECONDS:300}
  knowledge:
    # Excel解析并生成报告后，只投影报告指标、结论和证据关系到知识库，不保存整份报告JSON副本
    auto-ingest-reports: true
    executor:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 20
    qa-executor:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 10
    # 只允许抓取这些官网域名；多个域名用逗号分隔，空值时新闻抓取接口拒绝执行
    news-allowed-domains: ${KB_NEWS_ALLOWED_DOMAINS:}
    # 支持正文直传；未传正文时仅抓取域名白名单内的URL
    news-ingest-enabled: true
    llm:
      api-url: ${ARK_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      model: ${ARK_MODEL:glm-5-2-260617}
      api-key: ${ARK_API_KEY:}
      # 知识问答需要同时综合报告与新闻，推理模型可能超过90秒
      timeout-seconds: ${KNOWLEDGE_LLM_TIMEOUT_SECONDS:300}
  excel:
    # 大型xlsm包含工作簿扫描和有限次数LLM识别，保留充足的全局执行时间
    parse-timeout-minutes: 30
    executor:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 20
    llm:
      api-url: ${ARK_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      model: ${ARK_MODEL:glm-5-2-260617}
      # API Key只从环境变量读取，禁止写入源码
      api-key: ${ARK_API_KEY:}
      # 单次LLM调用失败时快速降级，避免阻塞整个工作簿任务
      table-timeout-seconds: ${ARK_TABLE_TIMEOUT_SECONDS:30}
      report-timeout-seconds: ${ARK_REPORT_TIMEOUT_SECONDS:180}
      max-retries: ${ARK_MAX_RETRIES:0}
      max-table-calls: ${ARK_MAX_TABLE_CALLS:4}

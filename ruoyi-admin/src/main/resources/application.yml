# 项目相关配置
ruoyi:
  # 名称
  name: 市场分析agent
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 50MB
      # 设置总上传的文件大小
      max-request-size: 200MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 业务解析任务配置
business:
  vehicle:
    schema-auto-init: true
  market-agent:
    # 新闻/PDF侧车继续使用8000；整车市场分析独立使用8001。
    base-url: ${MARKET_AGENT_BASE_URL:http://127.0.0.1:8001/api}
    connect-timeout-seconds: ${MARKET_AGENT_CONNECT_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${MARKET_AGENT_REQUEST_TIMEOUT_SECONDS:600}
  pdf:
    schema-auto-init: true
  document:
    private-root: ${BUSINESS_DOCUMENT_PRIVATE_ROOT:D:/ruoyi/business-document-private}
  news:
    # POC直接使用RuoYi原有MySQL数据源，启动时幂等补齐新闻采集扩展表
    schema-auto-init: true
    llm:
    # 用于加密持久化前端保存的API Key；生产环境请通过LLM_CONFIG_SECRET设置独立且稳定的随机密钥
    persistence-secret: ${LLM_CONFIG_SECRET:${token.secret}}
    api-url: ${LLM_API_URL:${ARK_API_URL:https://api.deepseek.com/v1/chat/completions}}
    model: ${LLM_MODEL:${ARK_MODEL:deepseek-chat}}
    api-key: ${LLM_API_KEY:${ARK_API_KEY:}}
  text:
    llm:
      # 推理型模型可能超过90秒，文本抽取独立设置较长超时
      timeout-seconds: ${TEXT_LLM_TIMEOUT_SECONDS:300}
  knowledge:
    # POC启动时幂等创建问答审计表；正式环境使用迁移平台后可关闭
    qa-schema-auto-init: true
    # AI报告入库时只投影指标、结论和证据关系，不保存整份报告JSON副本
    auto-ingest-reports: true
    # 使用同事的Python解析器；Python只返回结构化结果，正式入库仍由本服务写MySQL
    agent-document-enabled: ${KNOWLEDGE_AGENT_DOCUMENT_ENABLED:true}
    executor:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 20
    qa-executor:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 10
    # 只允许抓取这些官网域名；多个域名用逗号分隔，空值时新闻抓取接口拒绝执行
    news-allowed-domains: ${KB_NEWS_ALLOWED_DOMAINS:}
    # 支持正文直传；未传正文时仅抓取域名白名单内的URL
    news-ingest-enabled: true
    llm:
      # 知识问答超时；接口/模型/Key 一律走 business.llm 统一配置
      timeout-seconds: ${KNOWLEDGE_LLM_TIMEOUT_SECONDS:300}
  excel:
    # 车载市场分析沿用受限后台任务，避免解析占用Tomcat请求线程
    parse-timeout-minutes: 30
    executor:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 20
    llm:
      # 与系统前端维护的统一LLM配置共用接口、模型和API Key
      table-timeout-seconds: ${ARK_TABLE_TIMEOUT_SECONDS:30}
      report-timeout-seconds: ${ARK_REPORT_TIMEOUT_SECONDS:180}
      max-retries: ${ARK_MAX_RETRIES:0}
      max-table-calls: ${ARK_MAX_TABLE_CALLS:4}
# Python新闻采集与PDF/PPTX解析侧车。LLM参数由上面的统一配置在每次内部请求中下发。
agent-service:
  base-url: ${AGENT_SERVICE_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: ${AGENT_SERVICE_CONNECT_TIMEOUT:10s}
  read-timeout: ${AGENT_SERVICE_READ_TIMEOUT:300s}
  document-read-timeout: ${AGENT_SERVICE_DOCUMENT_READ_TIMEOUT:1800s}
  news-read-timeout: ${AGENT_SERVICE_NEWS_READ_TIMEOUT:600s}
  vehicle-read-timeout: ${AGENT_SERVICE_VEHICLE_READ_TIMEOUT:600s}
  internal-token: ${AGENT_INTERNAL_TOKEN:}
